name: CI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch fonts (build-time only, never on device)
        run: |
          D=$RUNNER_TEMP
          curl -fSL --retry 3 -o $D/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -q -o $D/inter.zip -d $D/inter
          curl -fSL --retry 3 -o $D/jbmono.zip https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
          unzip -q -o $D/jbmono.zip -d $D/jbmono
          FONTDIR=app/src/main/res/font
          mkdir -p $FONTDIR
          cp $D/inter/extras/ttf/Inter-Regular.ttf   $FONTDIR/inter_regular.ttf
          cp $D/inter/extras/ttf/Inter-Medium.ttf    $FONTDIR/inter_medium.ttf
          cp $D/inter/extras/ttf/Inter-SemiBold.ttf  $FONTDIR/inter_semibold.ttf
          cp $D/jbmono/fonts/ttf/JetBrainsMono-Regular.ttf $FONTDIR/jetbrains_mono_regular.ttf
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DartIDE-debug-apk
          path: app/build/outputs/apk/debug/*.apk
